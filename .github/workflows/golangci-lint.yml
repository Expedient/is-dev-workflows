name: golangci-lint
on:
  workflow_call:
    inputs:
      GO_VERSION:
        default: '1.22'
        type: string
      GOLANGCI_LINT_VERSION:
        default: 'v1.64.6'
        type: string
      GOLANGCI_LINT_TIMEOUT:
        default: '3m'
        type: string
    secrets:
      IS_GITHUB_USERNAME:
        required: true
      IS_GITHUB_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: "github.com/expedient"
    steps:
      - name: Configure git for private modules
        env:
          TOKEN: ${{ secrets.IS_GITHUB_TOKEN }}
          USERNAME: ${{ secrets.IS_GITHUB_USERNAME }}
        run: |
          git config --global url."https://${USERNAME}:${TOKEN}@github.com".insteadOf "https://github.com" && \
          export GOPRIVATE="github.com/expedient"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.GO_VERSION }}
      - uses: actions/checkout@v5
      - name: golangci-lint (v1)
        if: startsWith(inputs.GOLANGCI_LINT_VERSION, 'v1')
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ inputs.GOLANGCI_LINT_VERSION }}
          args: --timeout=${{ inputs.GOLANGCI_LINT_TIMEOUT }}
      - name: golangci-lint (v2)
        if: startsWith(inputs.GOLANGCI_LINT_VERSION, 'v2')
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ inputs.GOLANGCI_LINT_VERSION }}
          args: --timeout=${{ inputs.GOLANGCI_LINT_TIMEOUT }}
