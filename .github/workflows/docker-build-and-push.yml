name: build and push
on:
  workflow_call:
    inputs:
      tags:
        required: true
        type: string
      use-cache:
        description: "Use cache for building the Docker image"
        required: false
        default: "true"
        type: string
      registry:
        description: "The docker registry to push the image to"
        required: false
        default: "docker.io"
        type: string
      use_github_token_auth:
        description: "Authenticate to the registry with the per-repo GITHUB_TOKEN instead of IS_DOCKER_HUB_* creds. Requires 'packages: write' on the calling job. Use for ghcr.io."
        required: false
        default: false
        type: boolean
    secrets:
      IS_DOCKER_HUB_USERNAME:
        required: false
      IS_DOCKER_HUB_PASSWORD:
        required: false
      build_args:
        required: false
    outputs:
      digest:
        description: "The digest of the docker image."
        value: ${{ jobs.build-and-push.outputs.digest }}

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.docker_build.outputs.digest }}
    steps:
      - name: Check Out Repo 
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.use_github_token_auth && github.actor || secrets.IS_DOCKER_HUB_USERNAME }}
          password: ${{ inputs.use_github_token_auth && github.token || secrets.IS_DOCKER_HUB_PASSWORD }}
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ${{ inputs.tags }}
          build-args: ${{ secrets.build_args }}
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}